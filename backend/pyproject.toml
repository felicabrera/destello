[project]
name = "destello"
version = "0.3.0"
description = "Destello backend: SPHEREx time-lapse pipeline and API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "arq>=0.26",
  "redis>=5.0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "astropy>=6.1",
  "astroquery>=0.4.7",
  "pyvo>=1.5",
  "photutils>=2.0",
  "reproject>=0.14",
  "numpy>=1.26",
  "scipy>=1.13",
  "Pillow>=10.4",
  "sqlmodel>=0.0.22",
  "pyyaml>=6.0",
  "pyarrow>=17",
  "astropy-healpix>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "hypothesis>=6.110",
  "ruff>=0.6",
  "mypy>=1.11",
  "fakeredis>=2.24",
  "types-PyYAML",
  "nbformat>=5.11.1",
  "nbclient>=0.11.0",
  "ipykernel>=7.4.0",
  "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/destello"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::astropy.utils.exceptions.AstropyWarning",
  "ignore::erfa.ErfaWarning",
  "ignore::photutils.utils.exceptions.NoDetectionsWarning",
]
testpaths = ["tests"]
markers = ["science: validation tests on recorded real cutouts"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["destello.core.*", "destello.pipeline.*"]
strict = true
