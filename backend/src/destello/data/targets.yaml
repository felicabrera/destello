    ra_deg: 248.1673783672889
    dec_deg: 66.75500674547219
    pmra_masyr: -20.642811719160797
    pmdec_masyr: 6.148818852711324
    pmra_err_masyr: 0.08512829
    pmdec_err_masyr: 0.091321476
    parallax_mas: 1.2509180143740992
