# End to end tests (Playwright) against the Vite dev server with recorded fixtures: no live IRSA calls and no
# secrets, so the workflow also runs for pull requests from forks. The suite includes the axe accessibility
# checks (tests/e2e/a11y.spec.ts).
name: e2e
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read}
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: {version: 11.22.0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      # playwright.config.ts uses channel "chrome", so the Chrome build is installed (not only Chromium).
      - run: pnpm exec playwright install --with-deps chrome
      - name: Playwright
        run: pnpm e2e --workers=2 --reporter=list,html
        env:
          CI: "true"
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
